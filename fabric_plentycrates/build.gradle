plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'net.darkhax.curseforgegradle'
    id 'com.modrinth.minotaur'
}

repositories { //all of these are for adding crates compat
    mavenLocal()
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven { url 'https://maven.blamejared.com' }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url = 'https://maven.minecraftforge.net/'
    }
}

//include forge generated crates
sourceSets {
    main {
        resources {
            srcDir "../forge_plentycrates/src/generated/resources"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    //MOD-implementation for 1.21.11+
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
  //  implementation project(":common")

    //mods
    modImplementation("curse.maven:apple-crates-630726:${apple_crates_file_fabric}")
    modRuntimeOnly("curse.maven:biomes-o-plenty-220318:${bop_file_fabric}")
    modRuntimeOnly("com.github.glitchfiend:TerraBlender-fabric:${minecraft_version}-${terrablender_file_fabric}")
    modRuntimeOnly("curse.maven:glitchcore-955399:${glitchcore_file_fabric}")
    //glitchcore config
    modImplementation "com.electronwill.night-config:core:3.6.5"
    modImplementation "com.electronwill.night-config:toml:3.6.5"
    modImplementation "net.jodah:typetools:0.6.3"
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {

    apiToken = findProperty('cf_api_token')
    def mainFile = upload(cf_bop, file("${project.buildDir}/libs/${base.archivesName.get()}-${version}.jar"))
    mainFile.displayName = "${bop}-fabric-${minecraft_version}-${version}"
    mainFile.releaseType = 'release'
    mainFile.changelog = "${changelog}"
    mainFile.changelogType = 'markdown'
    mainFile.addJavaVersion('Java 17')
    mainFile.addRequirement('apple-crates')
    mainFile.addRequirement('biomes-o-plenty')
    mainFile.addModLoader('fabric')
}

modrinth {
    token.set(project.findProperty('modrinth_api_token'))
    projectId.set(modrinth_bop)
    changelog = "${changelog}"
    versionName.set("${bop}-Fabric-${minecraft_version}-$version")
    versionType.set("${releasetype}")
    uploadFile.set(tasks.remapJar)
    dependencies {
        required.project("fabric-api")
    }
    loaders = ["fabric"]
    gameVersions = ["${minecraft_version}"]
}