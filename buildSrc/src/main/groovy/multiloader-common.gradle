plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                   : version,
            'group'                     : project.group, // Else we target the task's group.
            'java_version'              : java_version,
            'changelog'                 : changelog,

            // Common
            'minecraft_version'         : minecraft_version,
            'minecraft_version_range'   : minecraft_version_range,
            'mod_name'                  : mod_name,
            'mod_author'                : mod_author,
            'mod_id'                    : mod_id,
            'license'                   : license,
            'credits'                   : credits,
            'mod_description'           : mod_description,
            'parchment_minecraft'       : parchment_minecraft,
            'parchment_version'         : parchment_version,

            // Forge
            'forge_version'             : forge_version,
            'forge_loader_version_range': forge_loader_version_range,

            // Fabric
            'fabric_version'            : fabric_version,
            'fabric_loader_version'     : fabric_loader_version,

            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,

            // Common Runs
            'common_runs_enabled'       : common_runs_enabled,
            'common_client_run_name'    : common_client_run_name,
            'common_server_run_name'    : common_server_run_name,

            // Dependencies (Files)
            'terrablender_file'         : terrablender_file,
            'patchouli_file'            : patchouli_file,
            'curios_file'               : curios_file,
            'kiwi_file'                 : kiwi_file,
            'cyclops_file'              : cyclops_file,
            'common_cap_file'           : common_cap_file,
            'lodestone_file'            : lodestone_file,
            'valhelsia_file'            : valhelsia_file,
            'apple_crates_file'         : apple_crates_file,
            'bop_file'                  : bop_file,
            'forbarc_file'              : forbarc_file,
            'intdyn_file'               : intdyn_file,
            'botania_file'              : botania_file,
            'fruit_file'                : fruit_file,
            'malum_file'                : malum_file,
            'enl_end_file'              : enl_end_file,
            'solar_file'                : solar_file,

            // Mod-Specific Dependencies
            'bop'                       : bop,
            'botania'                   : botania,
            'byg'                       : byg,
            'pw'                        : pw,
            'forbarc'                   : forbarc,
            'tcon'                      : tcon,
            'nourishedend'              : nourishedend,
            'malum'                     : malum,
            'fruit'                     : fruit,
            'solar'                     : solar,
            'intdyn'                    : intdyn,

            // Mod ID Mappings
            'byg_id'                    : byg_id,
            'bop_id'                    : bop_id,
            'bot_id'                    : bot_id,
            'intdyn_id'                 : intdyn_id,
            'prem_id'                   : prem_id,
            'solar_id'                  : solar_id,
            'fruit_id'                  : fruit_id,
            'malum_id'                  : malum_id,
            'eend_id'                   : eend_id,
            'tcon_id'                   : tcon_id,
            'forbarc_id'                : forbarc_id,

            'lodestone_file_fabric'     : lodestone_file_fabric,
            'apple_crates_file_fabric'  : apple_crates_file_fabric
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}
