buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url = 'https://maven.parchmentmc.org' }
        maven {
            name = "SpongePowered"
            url = "https://repo.spongepowered.org/maven"
        }    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6+', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath "org.spongepowered:mixingradle:0.7-SNAPSHOT" // or stable version if available
    }
}
plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
    id 'net.darkhax.curseforgegradle' version '1.0.11'
//    id 'org.spongepowered.mixin'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    runs {
        configureEach {
//            property 'mixin.env.remapRefMap', 'true'
//            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
        }
        client {
            client()
        }
        data {
            data()
            def fullModId = "${project.mod_id}${project.bot_id}"
            programArguments.addAll '--mod', fullModId, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

    }

    mods {
        testproject {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories { //all of these are for adding crates compat
    mavenLocal()
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven { url 'https://maven.blamejared.com' }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = 'jTDev MavenReleases'
        url = 'https://maven.jt-dev.tech/releases'
    }
}
dependencies {
    compileOnly project(":common")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    //mods
    modImplementation("curse.maven:apple-crates-630726:${apple_crates_file}")
    modImplementation("curse.maven:oh-the-biomes-weve-gone-1070751:${byg_file}")
    modImplementation("curse.maven:geckolib-388172:${geckolib}")
    implementation("corgitaco.corgilib:Corgilib-Forge:${corgilib}")
    modImplementation("curse.maven:oh-the-trees-youll-grow-962544:${ohthetreesyoullgrow}")
//    modImplementation("curse.maven:terrablender-563928:${terrablender_file}")
    implementation('com.github.glitchfiend:TerraBlender-forge:1.20.1-3.0.1.10')
}

jar {
    finalizedBy('reobfJar')
}

task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {

    apiToken = findProperty('cf_api_token')

    // The main file to upload
    def mainFile = upload(669657, file("${project.buildDir}/libs/${archivesBaseName}-${version}.jar"))
    mainFile.displayName = "${byg}-forge-${minecraft_version}-${version}"
    mainFile.releaseType = 'release'
    mainFile.changelog = "${changelog}"
    mainFile.changelogType = 'markdown'
    mainFile.addJavaVersion('Java 17')
    mainFile.addRequirement('apple-crates')
    mainFile.addRequirement('oh-the-biomes-weve-gone')
}
