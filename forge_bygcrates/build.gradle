plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'net.darkhax.curseforgegradle'
    id 'com.modrinth.minotaur'
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            clientData()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources. def fullModId
            def fullModId = "${project.mod_id}${project.byg_id}"
            programArguments.addAll '--mod', fullModId, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories { //all of these are for adding crates compat
    mavenLocal()
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven { url 'https://maven.blamejared.com' }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = 'jTDev MavenReleases'
        url = 'https://maven.jt-dev.tech/releases'
    }
    maven {
        url = 'https://maven.minecraftforge.net/'
    }
}
dependencies {
    // compileOnly project(":common")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    //mods
    implementation("curse.maven:apple-crates-630726:${apple_crates_file}")
    runtimeOnly("curse.maven:oh-the-biomes-weve-gone-1070751:${byg_file}")
    runtimeOnly("curse.maven:geckolib-388172:${geckolib}")
    runtimeOnly("curse.maven:oh-the-trees-youll-grow-962544:${ohthetreesyoullgrow}")
    runtimeOnly("curse.maven:corgilib-693313:${corgilib}")
//    implementation("curse.maven:terrablender-563928:${terrablender_file}")
    runtimeOnly("com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terrablender_file}")

}



tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {

    apiToken = findProperty('cf_api_token')

    // The main file to upload
    def mainFile = upload(cf_byg, file("${project.buildDir}/libs/${base.archivesName.get()}-${version}.jar"))
    mainFile.displayName = "${byg}-forge-${minecraft_version}-${version}"
    mainFile.releaseType = 'release'
    mainFile.changelog = "${changelog}"
    mainFile.changelogType = 'markdown'
    mainFile.addJavaVersion('Java 17')
    mainFile.addRequirement('apple-crates')
    mainFile.addRequirement('oh-the-biomes-weve-gone')
}

modrinth {
    token.set(project.findProperty('modrinth_api_token'))
    projectId.set(modrinth_byg)
    changelog = "${changelog}"
    versionName.set("${byg}-NeoForge-${minecraft_version}-$version")
    versionType.set("${releasetype}")
    uploadFile.set(tasks.jar)
    loaders = ["neoforge"]
    gameVersions = ["${minecraft_version}"]
}